
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#10B981"
  />

  <meta
    name="description"
    content="Track, manage and analyze your personal expenses."
  />

  <title>ExpenseFlow — Personal Finance</title>

  <link rel="icon" href="/icons/icon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
</head>

<body>

  <!-- Premium Clean Splash Loading Screen -->
  <div id="app-splash-screen" role="progressbar" aria-label="Loading ExpenseFlow" aria-valuemin="0" aria-valuemax="100">
    <div class="splash-content">
      <div class="splash-logo-wrap">
        <div class="splash-glow"></div>
        <div class="splash-icon">₹</div>
      </div>

      <div class="splash-brand">
        <h1>ExpenseFlow</h1>
        <span class="splash-tagline">Personal Finance</span>
      </div>

      <div class="splash-progress-track">
        <div class="splash-progress-fill" id="splash-progress-bar"></div>
      </div>

      <div class="splash-status-text" id="splash-status-text">
        Initializing workspace...
      </div>
    </div>

    <div class="splash-footer">
      <span class="splash-badge-dot"></span>
      <span>100% Private & Local Storage</span>
    </div>
  </div>

  <div id="app"></div>

  <script type="module" src="/js/main.js"></script>

</body>
</html>
